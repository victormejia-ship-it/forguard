       Si la fuente oficial de Forguard es otra (Gilroy, Sofia Pro, etc.),
       cámbiala SOLO en estas dos líneas y todo el documento se actualiza. */
    /* Una sola familia. Inter se fue: no aparece en ninguna de las cuatro
       cotizaciones de referencia — era eleccion del autor de la plantilla, no
       del documento. Poppins en la tabla y en el titulo de 72 pt es DECISION,
       no medicion: esos elementos salieron en Helvetica en los cuatro PDF
       porque se reimprimieron por macOS, asi que ningun archivo demuestra que
       eran. Se elige por ser la fuente de marca. */
    --font-display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
    --font-body:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;

    /* ---- COLORES ------------------------------------------------------
       Todos MEDIDOS del relleno vectorial de las cotizaciones reales, no
       muestreados de una imagen. Un JPEG desplaza el color: la primera versión
       de esta plantilla decía #08194B por eso, y el navy de verdad —el mismo de
       la marca— es #002369. Ver docs/ESPECIFICACION-DOCUMENTO.md.

       Los colores de la PORTADA viven en su propio bloque de CSS, tecleados
       ahí a propósito: la portada es una réplica medida y sus colores no se
       comparten con ninguna otra hoja. Aquí quedan solo los de las hojas
       interiores. (Se podó toda la familia que la portada vieja declaraba y ya
       nadie usa: --navy, --navy-hondo, --ink, --white, --meta, --meta-val,
       --tagline-cover y los tres --chip.) */
    --title:#14181D;        /* títulos grandes en hoja blanca */
    --brand-navy:#002369;   /* logotipo en hoja blanca — el navy de marca */
    --label-blue:#3C63A8;   /* "Concepto Cotizado:" / "Cliente" */
    --text:#22282F;
    --muted:#9AA1AB;
    --rule:#DFE3E8;
    --rule-strong:#C9CFD6;
    --zebra:#F5F7F9;
    --shade:#8BB4D8;        /* celda marcada del calendario — medido del vector */
  }

  /* print-color-adjust:exact EN TODO: fuerza que fondos y colores se impriman
     aunque «Gráficos de fondo» esté apagado en el diálogo de Chrome — que es su
     estado por omisión. Sin esto, el navy entero desaparecía del PDF y el
     documento salía como texto flotando en blanco. Es lo que permite que el
     banner no tenga que pedirle ajustes a nadie. Y con @page{margin:0} el
     navegador tampoco tiene margen donde pintar sus encabezados y pies, así
     que esas dos casillas dejan de importar. */
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:#E9EBEE;font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;}

  /* SIN overflow:hidden, y no se vuelve a poner.
     Lo tenía, y con él una tabla más larga que la hoja perdía renglones EN
     SILENCIO: MXGT01 imprimía 27 de sus 36 equipos y el bloque de Precio Anual
     quedaba fuera del papel, con la hoja viéndose llena y bien formada. Recortar
     es la peor forma de fallar en un documento que se le manda a un cliente.
     Ahora la tabla se parte en hojas (ver partirEnHojas) y si algún día algo se
     desborda, se VE que se desborda. */
  .page{
    position:relative;width:8.5in;height:11in;margin:22px auto;
    background:#fff;
    box-shadow:0 4px 24px rgba(8,25,75,.15);
  }
  /* Documento "solo calendario" (24-sep-2026, pedido explícito de Victor:
     "mejor visibilidad" para las 12 columnas de mes) — SOLO cuando
     POLIZA.vistaDocumento === 'calendario' (ver el armado de docHTML, más
     abajo) las tres hojas de ese documento más corto (Portada, Calendario,
     Cierre) llevan esta clase y miden al revés: 11×8.5in en vez de
     8.5×11in. El @page de impresión se ajusta aparte por JS (buscar
     "landscape" en el script) porque una sola hoja HTML sirve los dos
     documentos y @page no se puede acotar por clase — nunca en la misma
     tanda de impresión conviven hojas portrait y horizontal, así que basta
     con UN @page dinámico para todo el documento activo. */
  .page.horizontal{ width:11in; height:8.5in; }

  /* ============================ PORTADA ============================
     Réplica MEDIDA de la portada real (la exportada de MXNL02, extraída del
     vector con MuPDF el 13-ago-2026, no muestreada de una imagen):

     · El fondo plano es #031649 — el navy de marca #002369 NO es el fondo, es
       el RELLENO de la marca de agua. Sin degradados: el PDF real no trae uno.
     · La marca de agua es el escudo de Forguard GIGANTE (1372 pt de alto, casi
       dos hojas), anclado a la derecha y recortado por los cuatro bordes.
       Contorno #1B2B59: es blanco al ~9.5% ya aplanado sobre el navy — se usa
       el color plano para que imprima idéntico en cualquier motor.
     · El título va en Helvetica A PROPÓSITO, no en Poppins: la portada replica
       el documento descargado tal cual, y los cuatro PDF reales la traen en
       Helvetica (72 pt, #E8E8E8, paso de 60.4 pt entre líneas).
     · Cliente/Fecha/Proyecto: 6.7 pt #5FAFF9, etiquetas en itálica, DOS
       separadores crema #F6F1D8 en x=237.4 y x=351.3.
     · La cinta izquierda son tres polígonos con corte diagonal (#6492B5,
       #8BB4D8, #49BA79), medio fuera de la hoja (arrancan en x=-7.1).

     overflow:hidden va SOLO aquí y no vuelve a las demás hojas: la marca de
     agua y la cinta se salen de la hoja a propósito, y la portada no tiene
     renglones de datos que un recorte pueda comerse — la prohibición general
     es para las tablas. */
  /* Helvetica PRIMERO, no Helvetica Neue: la reimpresión de macOS que es la
     referencia usa la Helvetica del sistema, y el panel de jueces cachó que el
     acento de la ó de Neue se dibuja más alto y más separado. Con la misma
     fuente, el glifo empata. */
  .cover{background:#031649;overflow:hidden;
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;}
  .cv-marca{position:absolute;left:0;top:0;width:612pt;height:792pt;}
  .cv-iso{position:absolute;left:52pt;top:53.3pt;color:#fff;line-height:0;}
  .cv-logo{position:absolute;left:154pt;top:196.8pt;color:#fff;line-height:0;}
  .cv-titulo{position:absolute;left:145.6pt;color:#E8E8E8;font-size:72pt;font-weight:400;}
  .cv-titulo div{line-height:72pt;white-space:nowrap;}
  /* Antes cada campo (Cliente/Fecha/Proyecto) iba con su propio left:XXXpt fijo,
     medido para nombres de cliente cortos — con uno largo ("STELLANTIS
     CAMIONES") el campo se salía de su cajón y se encimaba con "Fecha:" justo
     a su derecha, ilegible. Ahora es un renglón flex: cada campo empuja al
     siguiente en vez de invadirlo, y si no cabe todo junto (cliente larguísimo,
     o la pantalla angosta de un celular) el que sigue baja de línea solo — se
     ve idéntico a la medición original cuando el nombre es corto, y nunca se
     encima cuando no lo es. */
  /* Rediseño del 23-sep-2026 (pedido de Victor, "que se vea mejor" con
     captura de esta sección): antes era una sola línea corrida en itálica
     de 6.7pt con separadores | que se encimaban con el texto en cuanto un
     valor (cliente/sitio/proyecto largo) forzaba un salto de línea — ver
     el comentario de arriba sobre STELLANTIS CAMIONES para el problema
     original. Ahora es un renglón de tarjetas etiqueta-arriba/valor-abajo,
     cada una con su propio ancho: un valor largo se envuelve DENTRO de su
     tarjeta sin invadir a la siguiente, sin importar cuántas líneas use.
     El acentito de color de arriba de cada tarjeta retoma los 3 colores de
     la cinta (.cv-cinta, misma paleta), para que se sienta parte del mismo
     sistema y no un bloque de texto aparte. Se aplicó igual en las tres
     plantillas que usan esta portada (Pólizas, Levantamientos, Imagen/
     Aperturas) — es la única parte de la portada de Pólizas que YA NO
     replica el PDF de referencia pixel a pixel, a propósito. */
  .cv-meta{position:absolute;top:534pt;left:145.6pt;right:50.6pt;
    display:flex;flex-wrap:wrap;column-gap:32pt;row-gap:16pt;}
  .cv-meta .campo{position:relative;max-width:230pt;padding-top:9pt;}
  .cv-meta .campo::before{content:"";position:absolute;top:0;left:0;width:18pt;height:1.6pt;}
  .cv-meta .campo:nth-child(1)::before{background:#8BB4D8;}
  .cv-meta .campo:nth-child(2)::before{background:#6492B5;}
  .cv-meta .campo:nth-child(3)::before{background:#49BA79;}
  .cv-meta .etiqueta{display:block;font-size:6.4pt;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#7FA8D9;margin-bottom:4pt;}
  .cv-meta .valor{display:block;font-size:9.5pt;font-weight:400;color:#F3F6FC;line-height:1.4;}
  .cv-cinta{position:absolute;left:-7.1pt;top:547.4pt;width:21.4pt;height:252.8pt;}
  .cv-tagline{position:absolute;right:50.6pt;top:745.6pt;font-size:8.2pt;color:#fff;}

  /* ======================= HOJAS DE CONTENIDO ======================= */
  .sheet{position:absolute;top:0;right:0;bottom:0;left:0;padding:.62in .72in;}
  .logo-tl{position:absolute;left:.62in;top:.42in;color:var(--brand-navy);}
  .wordmark-tr{position:absolute;right:.62in;top:.46in;color:var(--brand-navy);line-height:0;}

  /* La columna de contenido va a lo MEDIDO: texto de 119.6 pt a 561.4 pt (margen
     derecho 50.6, el mismo al que está anclado el tagline en las cuatro). Antes el
     título iba en 111.6 pt y las tablas arrancaban en 51.84: las tablas empezaban
     60 pt a la IZQUIERDA de su propio título. Eso era la proporción de la
     plantilla, no el documento. Ver ESPECIFICACION-DOCUMENTO.md §Márgenes.
     Ojo: la tinta de la esquina navy arranca en x=38 y NO se mueve con esto. */
  .eyebrow{position:absolute;left:119.6pt;top:.78in;font-size:8.5px;color:#5C6673;letter-spacing:.1px;}
  .h1{position:absolute;left:118.1pt;top:.98in;right:50.6pt;
      font-family:var(--font-body);font-weight:300;font-size:36px;line-height:1.06;
      letter-spacing:-.8px;color:var(--title);}
  .h1.two{font-size:33px;}

  .metabar{position:absolute;left:119.6pt;top:2.05in;font-size:9.5px;}
  .metabar td{padding-right:56px;vertical-align:top;}
  .metabar .k{color:var(--label-blue);padding-bottom:3px;}
  .metabar .v{color:var(--text);}

  .body{position:absolute;left:119.6pt;right:50.6pt;top:2.62in;}

  /* ---- Tablas ---- */
  /* Medido de las cuatro cotizaciones: TODAS las columnas van CENTRADAS —
     desviación del centro 0.00 pt con hasta seis anchos distintos de valor— y el
     encabezado comparte centro con sus datos, desfase 0.0. La única excepción es
     Concepto, cuyo encabezado va centrado pero sus datos a la izquierda.
     Ver docs/ESPECIFICACION-DOCUMENTO.md. */
  table.grid{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.grid thead th{
    font-size:6.2pt;font-weight:700;color:#2B3341;text-align:center;
    padding:6px 0;border-bottom:1.2px solid var(--rule-strong);
  }
  /* padding horizontal 0 en el cuerpo: el concepto más ancho de las cuatro
     ocupa 125.4 pt de los 126.6 de su columna — 1.2 pt de holgura. Con 1 pt de
     padding por lado ya no cabría. */
  table.grid tbody td{font-size:6.2pt;padding:0;border-bottom:1px solid var(--rule);
    vertical-align:middle;text-align:center;}
  table.grid tbody td.cpt{text-align:left;padding-left:0;}

  /* ---- La tabla de renglones, a los centros MEDIDOS ----
     Los cuatro PDF no dibujan una sola regla vertical, así que no dicen dónde
     empieza una celda: lo que dicen son las LÍNEAS DE CENTRO de cada columna
     (# 133.5 · Cantidad 297.0 · Precio 354.2 · Total 415.3 · Frecuencia 474.4 ·
     Total Mtto 531.4) y que Concepto va a la izquierda arrancando en x=144.8 con
     126.6 pt de ancho. Los bordes se reconstruyen en el punto medio entre centros
     vecinos, y con eso los SIETE centros salen exactos, no aproximados:

       #  22.6 → borde 144.8   Cantidad 51.2 → 322.6   Total    59.0 → 444.8
       Concepto 126.6 → 271.4  Precio   63.2 → 385.8   Frecuencia 59.2 → 504.0
                                                       Total Mtto 54.8 → 558.8

     Suman 436.6 pt y la tabla arranca en 122.2 (2.6 pt dentro del cuerpo, que
     empieza en 119.6). Al tocar esto se mueve la paginación: los topes de filas
     por hoja se REMIDEN, no se heredan. */
  table.grid:not(.desc){width:436.6pt;margin-left:2.6pt;}
  /* Paso entre filas MEDIDO: 21.53 pt, altura fija. Antes lo definía el padding,
     así que el paso cambiaba con el cuerpo de la letra. Si un concepto no cupiera
     en su renglón la fila crece —envuelve, no se recorta— y de eso se encarga
     evitarTraslapeConPie(); el aviso de captura por ancho existe para que casi
     nunca pase. */
  table.grid:not(.desc) tbody tr{height:21.53pt;}
  /* Concepto y marca a 7.2 pt; las cifras a 6.2. Son dos cuerpos distintos en las
     cuatro cotizaciones, no uno. */
  table.grid:not(.desc) tbody td.cpt{font-size:7.2pt;line-height:1.05;}
  /* Interlineado apretado en la celda del concepto para que el renglón que trae
     marca CAIGA TAMBIÉN en 21.53. Con el interlineado por omisión, las dos líneas
     apiladas pedían 21.75 y cinco de los 36 renglones de MXGT01 se salían del paso
     medido: poco, pero el paso deja de ser uniforme y se come el margen de la
     paginación. Los cuatro PDF nunca apilan —MXGT01 lleva Marca en columna
     aparte—, así que apilarla es decisión nuestra y le toca caber. */
  table.grid:not(.desc) tbody td.cpt .marca{line-height:1.05;}
  /* La marca pegada al concepto, en cuerpo más chico. Envuelve sola: la celda
     aguanta dos líneas y con eso el truncado es casi inalcanzable. */
  .marca{font-size:7.6px;color:#5C6673;}

  .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .c{text-align:center;font-variant-numeric:tabular-nums;}
  /* El número de renglón NO va en gris: medido en MXGT01, INOAC y NGK, va en
     #000000, exactamente igual que el concepto de su fila. El gris venía de la
     plantilla vieja y hacía que el renglón se leyera como secundario. */
  .ix{text-align:center;}   /* el ancho lo manda el colgroup medido */
  /* Renglón "responsabilidad del cliente": un tinte de fondo en la FILA, no
     texto — no puede desbordar la celda ni mover el paso de 21.53 pt.
     print-color-adjust:exact (arriba) obliga a que se imprima igual que se
     ve en pantalla, no solo en el PDF "Guardar como" del navegador. Mismo
     ámbar que --alerta-suave en la app, para que quien conozca el tablero
     reconozca el color igual aquí. */
  table.grid:not(.desc) tbody tr.fuera-alcance{background:#FDF4E5;}
  table.grid:not(.desc) tbody tr.fuera-alcance td.ix{font-weight:700;}

  /* Aviso de obra civil, PEGADO al listado de conceptos —a diferencia de la
     cláusula gemela en Consideraciones Relevantes (8.5pt, ver .clause), aquí
     va en 12.5pt y en mayúsculas: se pidió que se note de mejor manera justo
     donde el cliente está mirando la lista de equipos y precios, no solo en
     la letra chica de varias hojas después. Se repite en CADA hoja de la
     tabla (si el listado no cabe en una sola), nunca solo en la última. */
  .aviso-exclusion-tabla{margin-top:10px;background:#FDF4E5;border:1.5px solid #E8B74C;
    border-radius:4px;padding:9px 12px;font-size:12.5px;font-weight:600;
    line-height:1.4;color:#5C3B00;text-align:center;}
  .aviso-exclusion-tabla b{color:#3A2600;text-transform:uppercase;letter-spacing:.2px;}

  /* Alcance Forguard / Alcance del cliente — pedido explícito de Victor
     (15-sep-2026, ampliado 15-sep-2026): DOS TABLAS separadas, no una sola
     tabla con un renglón divisor — cada una con su propio encabezado y su
     propia numeración (#) empezando en 1. El título va como bloque ANTES
     de la tabla (no como <tr>), así el navegador nunca lo confunde con un
     equipo más al medir alturas de fila. Se repite en cada hoja que ocupe
     esa sección (igual que el <thead> de columnas ya se repite), para que
     una hoja de continuación no pierda de vista a cuál alcance pertenece.
     bloque-tabla trae el espacio real entre una tabla y la otra cuando
     ambas caen en la misma hoja. */
  .bloque-tabla{margin-top:14px;}
  .bloque-tabla:first-child{margin-top:0;}
  .tit-bloque{font-size:7.6pt;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    text-align:center;padding:5pt 4pt;border:1px solid var(--rule-strong);border-bottom:none;}
  .tit-bloque.forguard{background:#E9F0FB;color:var(--brand-navy);}
  .tit-bloque.cliente{background:#FDF4E5;color:#5C3B00;}
  .bloque-tabla .tit-bloque + table.grid{margin-top:0;}

  /* ---- Totales ---- */
  .totals{margin-top:16px;width:100%;}
  .totals td{font-size:11px;padding:6px 9px;}
  .totals .lbl{text-align:right;color:#2B3341;font-weight:600;}
  .totals .val{text-align:right;width:1.5in;font-variant-numeric:tabular-nums;}
  .totals tr.grand td{font-weight:700;border-top:1px solid var(--rule-strong);}
  .note{margin-top:12px;font-size:8.5px;color:#5C6673;line-height:1.6;}
  .note li{margin-left:12px;}

  /* ---- Calendario ---- */
  table.cal{width:100%;border-collapse:collapse;table-layout:fixed;}
  /* 5.76 pt es el tamaño MEDIDO de los encabezados de mes en las cotizaciones
     reales, y ahí van todos en UNA línea: el más ancho, «may-27», mide 19.21 pt
     de los 23.53 de su columna. Aquí se partían unos y otros no —«ago-26» sí,
     «sep-26» no— porque el guion permite salto y el relleno lateral de 2px por
     lado dejaba el texto justo en el límite: los meses de letras anchas (ago,
     nov, mar, may) se pasaban y los angostos no. Con nowrap NUNCA se parten, y
     sin relleno lateral les sobra espacio. Que se rompan de forma distinta según
     el mes es lo que se veía mal, más que el corte en sí. */
  table.cal th{font-size:5.76pt;font-weight:600;color:#2B3341;padding:5px 0;text-align:center;
               white-space:nowrap;border-bottom:1.2px solid var(--rule-strong);}
  table.cal th.cpt{text-align:left;padding-left:7px;}
  /* Paso vertical MEDIDO: 22.4 pt, con la celda marcada de 22.3 — o sea que la
     celda llena su renglón y las de arriba y abajo se tocan, igual que se tocan
     a lo ancho (celda 23.5 con paso 23.53). Iba en 20px = 15 pt, siete pt y medio
     por renglón menos que el documento real: veintiún renglones apretados en
     donde el original usa la hoja completa. Con el borde de 0.75 pt, 21.65 de
     alto dan el paso: con border-collapse el borde va DENTRO del alto declarado,
     así que se declara el paso completo y no el paso menos el borde (con 21.65 el
     paso salía en 21.64 — medido, no supuesto). */
  table.cal td{border-bottom:1px solid var(--rule);height:22.4pt;padding:0;}
  table.cal td.lbl{font-size:8px;padding:4px 7px;line-height:1.25;}
  table.cal td.ix{font-size:8px;text-align:right;padding-right:4px;}
  /* Separadores verticales de las columnas de mes. Los documentos de referencia
     NO los traen —medido: cero reglas verticales— pero con doce columnas cuesta
     seguir a qué mes pertenece una celda a media tabla. Van desde la 3ª columna
     (la 1ª es #, la 2ª Concepto), así que la primera raya también separa el
     texto de la rejilla. Tono suave: la rejilla se lee por sus celdas
     sombreadas, y una raya oscura competiría con ellas. */
  table.cal th:nth-child(n+3),
  table.cal td:nth-child(n+3){border-left:1px solid var(--rule);}
  table.cal td.on{background:var(--shade);}

  /* ---- Consideraciones ---- */
  .clause{border-top:1px solid var(--rule);padding:9px 0 8px;}
  .clause .hd{font-size:8.5px;font-weight:600;letter-spacing:.5px;color:#2B3341;text-align:center;padding-bottom:6px;}
  .clause p{font-size:8.5px;line-height:1.55;color:#2E353E;}
  .clause .two-col{width:100%;border-collapse:collapse;}
  .clause .two-col td{width:50%;vertical-align:top;padding-right:16px;font-size:8.5px;line-height:1.5;color:#2E353E;}
  .clause .two-col b{display:block;color:#2B3341;padding-bottom:3px;}
  /* Mismo ámbar (#FDF4E5) que tr.fuera-alcance en la tabla de equipos, arriba
     — para que esta cláusula se lea como "responsabilidad del cliente" al
     primer vistazo, igual que un renglón marcado así en la tabla. */
  .aviso-exclusion{background:#FDF4E5;border:1px solid #F0DCB0;border-radius:4px;padding:8px 11px;}
  .aviso-exclusion p{margin:0;}

  /* ---- Descripción de trabajos ---- */
  table.desc tbody td{font-size:8.5px;line-height:1.45;padding:6px 7px;}
  table.desc tbody td.eq{width:1.75in;font-weight:600;color:#2B3341;}

  /* ---- Pie ---- */
  .footwrap{position:absolute;left:.72in;right:.72in;bottom:.46in;}
  .foot{width:100%;table-layout:fixed;border-collapse:collapse;}
  .foot td{font-size:8px;color:var(--muted);line-height:1.45;vertical-align:bottom;word-wrap:break-word;}
  .foot .k{font-weight:700;color:#8A929D;display:block;}
  .foot .tag{text-align:right;font-size:10px;color:#2E4E96;}

  /* ---- Barra de guardar ----
     Un solo botón que abre el diálogo de imprimir ya listo. Los tres ajustes
     que antes pedíamos a mano ya no hacen falta: print-color-adjust:exact
     imprime el navy con «Gráficos de fondo» apagado, y @page{margin:0} deja al
     navegador sin margen donde pintar encabezados. Lo único que el navegador no
     nos deja decidir es el DESTINO del diálogo — por eso la pista.
     position:fixed a propósito: no empuja el contenido ni puede alterar la
     paginación. Casi negro y con sombra, NO el navy del documento: sobre la
     portada un banner navy se camufla y parece parte del papel. */
  .aviso-impresion{position:fixed;top:0;left:0;right:0;z-index:50;
    background:#0E1116;color:#fff;font-family:var(--font-body);
    font-size:12.5px;line-height:1.5;padding:9px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    display:flex;gap:8px 16px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .aviso-impresion button{
    font-family:var(--font-body);font-size:13px;font-weight:700;color:#06281a;
    background:#54C682;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;}
  .aviso-impresion button:hover{background:#7EE2A8;}
  .aviso-impresion .pista{color:#9FB3DC;}

  @media print{
    body{background:#fff;}
    .page{margin:0;box-shadow:none;page-break-after:always;}
    /* Sin esto, Chrome pedía un salto de página después de la ÚLTIMA hoja
       también y sacaba una hoja en blanco de más al guardar como PDF —
       mismo hallazgo que ya se corrigió en el documento de Imagen/
       Aperturas (Victor, 21-sep-2026). */
    .page:last-child{page-break-after:auto;}
    @page{size:letter;margin:0;}
    /* El banner es para la persona, no para el papel. */
    .aviso-impresion{display:none;}
  }

  /* Hoja de cierre: solo el logo, centrado — mismo criterio que ya lleva
     el documento de Imagen/Aperturas (pedido de Victor, 21-sep-2026: "la
     ultima hoja se vea como la de la portada pero sola y exclusivamente
     con el logotipo"). Va SIN cabecera/pie: es a propósito distinta a las
     demás, no una continuación más. Un flex centrado no necesita saber si
     su .page mide 8.5×11 o 11×8.5: por eso esta misma hoja sirve para los
     dos documentos sin ningún ajuste. */
  .pagina-cierre{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;color:var(--brand-navy);}

  /* ==================== PORTADA DEL "SOLO CALENDARIO" ====================
     Distinta de .cover (que es una réplica MEDIDA pixel a pixel de un PDF
     real en portrait, con su escudo gigante calibrado exactamente contra
     un lienzo de 8.5×11in): forzar esa réplica a 11×8.5 distorsionaría el
     escudo sin ninguna referencia real contra la cual recalibrarlo. Esta es
     una portada nueva y más simple, pensada desde cero para el lienzo
     horizontal — mismo navy de marca, mismo logo, mismo eslogan, sin
     intentar imitar la portada de la póliza completa al pixel. */
  .cover-calendario{background:#031649;color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 .9in;}
  .cc-lockup{position:absolute;left:.75in;top:.65in;display:flex;align-items:center;gap:14pt;color:#fff;}
  .cc-titulo{font-family:var(--font-body);font-weight:300;font-size:40pt;line-height:1.12;
    color:#F3F6FC;max-width:8in;}
  .cc-meta{display:flex;gap:46pt;margin-top:26pt;}
  .cc-meta .campo{position:relative;padding-top:10pt;min-width:140pt;}
  .cc-meta .campo::before{content:"";position:absolute;top:0;left:0;width:18pt;height:2pt;}
  .cc-meta .campo:nth-child(1)::before{background:#8BB4D8;}
  .cc-meta .campo:nth-child(2)::before{background:#49BA79;}
  .cc-meta .etiqueta{display:block;font-size:8pt;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:#7FA8D9;margin-bottom:4pt;}
  .cc-meta .valor{display:block;font-size:12pt;color:#F3F6FC;line-height:1.4;}
  .cc-tagline{position:absolute;right:.75in;bottom:.55in;font-size:9pt;color:#fff;}
  .cc-marca{position:absolute;right:-40pt;bottom:-60pt;color:#1B2B59;opacity:.6;}
</style>

<body>
<!-- La barra de la herramienta: un botón y una sola pista. Se quita del papel
     (@media print) y del DOM cuando no hay datos que imprimir. -->
<div class="aviso-impresion" id="avisoImpresion">
  <button type="button" onclick="window.print()">Guardar como PDF</button>
  <span class="pista">si sale una impresora, cambia el destino a «Guardar como PDF»</span>
</div>
<div id="doc"></div>

<script>
/* ==================== DATOS ====================
   El tablero deja aquí el documento YA RESUELTO, en sessionStorage, antes de
   abrir esta pestaña. Esta plantilla FORMATEA Y CONCATENA: no multiplica, no
   divide, no calcula módulos y no decide títulos. Todo eso lo hizo
   armarPayloadPoliza() con las mismas funciones que pinta la pantalla — si aquí
   se volviera a calcular, habría dos lugares que hacen la misma cuenta y el
   descuadre que originó este módulo regresaría por otra puerta.

   Si no hay datos NO se pinta un caso demo. Antes había uno y era una trampa:
   un fallo del puente salía como un documento de aspecto perfecto con cifras
   inventadas, y eso se le puede mandar a un cliente sin que nadie lo note. Vale
   mil veces más una hoja que dice «Sin datos».
   ============================================================= */
const LLAVE_DOC = 'forguard.documento.poliza';

function leerPayload(){
  let crudo = null;
  try{ crudo = sessionStorage.getItem(LLAVE_DOC); }
  catch(e){ return { error:'El navegador no dejó leer los datos de la pestaña.' }; }
  if(!crudo) return { error:'No llegaron datos del tablero.' };
  let d;
  try{ d = JSON.parse(crudo); }
  catch(e){ return { error:'Los datos llegaron dañados y no se pudieron leer.' }; }
  if(!d || !Array.isArray(d.renglones) || !d.calendario || !d.totales)
    return { error:'Los datos llegaron incompletos.' };
  return { doc:d };
}

const LEIDO = leerPayload();
const POLIZA = LEIDO.doc || null;

/* ========================== UTILIDADES ==========================
   Aquí ya NO viven mxn2/mxn0, totalRenglon, precioAnual ni encabezadoMeses.
   Se fueron a propósito: cada una era un segundo lugar donde se calculaba algo
   que la app ya había calculado. Las cifras llegan formateadas y los doce
   encabezados llegan hechos. */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MESES = POLIZA ? POLIZA.calendario.encabezados : [];
/* En el "solo calendario" el nombre del documento en sí cambia —ya no es
   "Póliza de Mantenimiento Preventivo" completa, es nada más su calendario—
   para que quien lo reciba no piense que le falta el resto del contrato. */
const SOLO_CALENDARIO = !!(POLIZA && POLIZA.vistaDocumento === 'calendario');
const CONCEPTO_DOCUMENTO = SOLO_CALENDARIO ? 'Calendario de Mantenimiento Preventivo' : 'Póliza de Mantenimiento Preventivo';

/* ---------- Identidad oficial de Forguard (SVG extraído de logo-forguard.svg) ----------
   Isotipo y logotipo van como vectores, no como texto: fidelidad exacta.
   El color se controla con "currentColor" desde CSS.                        */
const ISOTIPO_VB="2.40 2.45 59.06 97.93", ISOTIPO_RATIO=0.6031;
const LOGOTIPO_VB="83.14 20.52 248.96 55.66", LOGOTIPO_RATIO=4.4729;

function isotipo(alto){
  const ancho=(alto*ISOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${ISOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${ISOTIPO_PATHS}</svg>`;
}
function logotipo(ancho){
  const alto=(ancho/LOGOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${LOGOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${LOGOTIPO_PATHS}</svg>`;
}

/* ---------- Piezas compartidas ---------- */
function sheetHead(titulo,dosLineas){

    <td><div class="k">${esc((POLIZA.textos && POLIZA.textos.conceptoEtiqueta) || 'Concepto Cotizado:')}</div><div class="v">${esc(CONCEPTO_DOCUMENTO)}</div></td>

/* ============================ PORTADA ============================
   Cada posición de aquí está MEDIDA del PDF real — ver el bloque de CSS de la
   portada para el porqué de cada color. Lo que se decide aquí:

   · El título baja del payload (2 o 3 líneas según el estatus). El paso entre
     líneas es 60.4 pt SALVO el hueco después de «Cotización» cuando hay tres:
     89.4 pt, porque en los documentos reales ese título son DOS cajas de texto
     puestas a mano en Canva, no un párrafo. Se replica el hueco, no se
     "corrige".
   · La vigencia YA NO va en la portada: la portada real trae Proyecto, y la
     vigencia se imprime en las notas de la tabla. El teléfono y correo del
     vendedor tampoco: la portada de referencia no los trae (van en el pie de
     las hojas interiores, como en el documento real).
   · La marca de agua reutiliza ISOTIPO_PATHS con preserveAspectRatio="none"
     para clavar la caja medida (275.2,-384 → 786.4×1372.5): fuerza ~5% de
     estirón horizontal, invisible en contornos abstractos, y a cambio cada
     cruce del escudo con los bordes de la hoja cae donde en el papel real. */
function pageCover(){
  const L = POLIZA.titulo.lineas;
  /* Caso nuevo (24-sep-2026, pedido de Victor: "coloca la leyenda completa
     'Póliza de mantenimiento preventivo'"): la póliza activa con título de
     tres líneas COMPLETAS ('Póliza de'/'Mantenimiento'/'Preventivo'). A
     diferencia de todo lo demás en esta portada, este texto NO existe en
     ninguno de los PDF de referencia —"Mantenimiento" ahí siempre iba
     abreviado como "Mtto."— así que no hay tinta real contra la cual medir
     un tamaño/posición "correctos". Se midió en cambio contra el propio
     ancho de la hoja: a 72pt (el tamaño de todo lo demás aquí) la palabra
     "Mantenimiento" mide ~472pt y se sale de las 612pt de la hoja empezando
     en left:145.6pt. 60pt es el primer tamaño redondo que la deja adentro
     con margen de sobra (~539pt de borde derecho, contra los 612pt de la
     hoja y los 561.4pt que usa cv-meta) — deliberadamente sin reusar los
     saltos de línea de 60.4/89.4pt de abajo (esos SÍ son de un PDF real, de
     un tamaño de letra distinto; mezclarlos aquí sería inventar precisión
     que no existe). */
  const esActivaCompleta = POLIZA.estatus === 'activa' && L.length === 3;
  /* Caja del título anclada por dónde arranca la primera línea en el papel:
     con 3 líneas (cotización) arranca en y=280.6; con 2 (póliza abreviada)
     en y=338.8. El -5.2 es CALIBRADO contra el papel con la Helvetica del
     sistema — la misma del PDF de referencia, así que ápice del acento,
     mayúsculas y ancho de tinta empatan en cero. Si algún día la fuente de
     la portada cambia, este número se recalibra midiendo tinta contra
     tinta, no se calcula. El caso de tres líneas completas usa su propio
     ancla (298pt), consistente con el bloque más chico de 60pt. */
  const topTitulo = esActivaCompleta ? 298 : (L.length >= 3 ? 280.6 : 338.8) - 5.2;
  const lineas = L.map((t, i) => {
    const margen = esActivaCompleta ? 0 : (i === 0 ? 0 : (L.length === 3 && i === 1 ? 17.4 : -11.6));
    const estiloLinea = esActivaCompleta ? ` style="margin-top:${margen}pt;line-height:60pt"` : ` style="margin-top:${margen}pt"`;
    return `<div${estiloLinea}>${esc(t)}</div>`;
  }).join('');

  return `<section class="page cover">
    <!-- Los TRES trazos del escudo gigante, extraídos del vector del PDF real
         tal cual, en coordenadas de la hoja (pt). No es ISOTIPO_PATHS escalado:
         el arte de la marca de agua difiere del logo y aproximarlo movía los
         cruces con los bordes hasta 20 pt — se midió. El relleno va en #021449,
         el color YA APLANADO que pinta el PDF (declara #002369 pero lo tapa una
         transparencia): el escudo se lee por su contorno, no por su relleno. -->
    <svg class="cv-marca" viewBox="0 0 612 792" aria-hidden="true">

/* ========================= PAGINACIÓN =========================
   Tres de las cinco hojas se desbordan con datos reales, y las tres se parten
   aquí. Los topes salen de MEDIR los cuatro documentos, no de estimar:

     · Tabla de renglones — 23 por hoja. Paso de fila 21.53 pt, primera fila en
       y=183.5, última posible en y=657.1. (183.5 + 22 × 21.53 = 657.2.)
     · Calendario — 21 por hoja. Máximo observado, en MXGT01, con paso 22.4 pt.
     · Descripción de trabajos — NO se puede partir por conteo: sus filas son de
       altura VARIABLE (19.8 a 28.0 pt medidos) porque el texto es largo. Se
       parte midiendo el alto real ya pintado.

   El bloque de cierre —Precio Anual, Precio Mensual y las notas— va SOLO en la
   última hoja de la tabla. En las intermedias sobraría y en la primera mentiría. */
const FILAS_POR_HOJA = 23;
const RENGLONES_CALENDARIO_POR_HOJA = 21;

function partirEnHojas(items, porHoja){
  const out = [];
  for(let i = 0; i < items.length; i += porHoja) out.push(items.slice(i, i + porHoja));
  return out.length ? out : [[]];
}

/* ====================== PÓLIZA (tabla + totales) ====================== */
/* Siete columnas, las de NGK: es el único de los cuatro documentos que imprime la
   aritmética completa, así que el cliente puede seguir la multiplicación de
   izquierda a derecha con una calculadora —Total = precio × cantidad, y
   Total Mtto = Total × frecuencia—. Verificado: sus 17 renglones cumplen las dos.

   La marca va PEGADA al concepto, en la misma celda y en cuerpo más chico. No es
   columna propia: los cuatro documentos que sí traen Marca la ponen como columna,
   pero entonces no cabe Cantidad, y una tabla sin Cantidad es exactamente de
   donde salieron las cantidades escondidas que hubo que deducir de los totales. */
const TITULO_ALCANCE = {
  forguard: 'Alcance Forguard — equipos incluidos en esta póliza',
  cliente: 'Alcance del cliente — fuera de esta póliza, bajo su responsabilidad'
};
const CLASE_ALCANCE = { forguard: 'alcance-forguard', cliente: 'alcance-cliente' };

function pagePoliza(){
  /* Alcance en DOS TABLAS separadas — pedido explícito de Victor (15-sep-2026,
     ampliado el mismo día dos veces): no una sola tabla con un renglón
     divisor, sino dos tablas de verdad, cada una con su propio encabezado de
     columnas y su propia numeración (#) empezando en 1 — y cada una en sus
     PROPIAS hojas, sin compartir página con la otra aunque quepan juntas:
     Forguard cierra su listado (con salto de hoja incluido si le sobra
     media hoja en blanco) y el de cliente arranca siempre en una hoja nueva.
     Forguard primero, cliente después. Como ya NO comparten numeración con
     el Calendario (que sigue usando POLIZA.renglones tal cual), cada
     renglón impreso aquí lleva un número LOCAL a su tabla (nTabla) — a
     propósito distinto del que ese mismo equipo trae en el Calendario. */
  const bloques = [
    { tono:'forguard', filas: POLIZA.renglones.filter(r => r.alcance !== 'cliente') },
    { tono:'cliente', filas: POLIZA.renglones.filter(r => r.alcance === 'cliente') }
  ].filter(b => b.filas.length)
   .map(b => ({ ...b, filas: b.filas.map((r,i) => ({ ...r, nTabla: i + 1 })) }))
   .map(b => ({ ...b, hojas: partirEnHojas(b.filas, FILAS_POR_HOJA) }));

  const totalHojas = bloques.reduce((t,b) => t + b.hojas.length, 0);
  const hayCliente = bloques.some(b => b.tono === 'cliente');
  let contador = 0;

  return bloques.map(bloque => bloque.hojas.map((grupo, h) => {
    contador++;
    /* El cierre solo en la última hoja de TODO el documento (la de
       Forguard si no hay renglones de cliente, la del cliente si sí los
       hay): en cualquier hoja intermedia sobraría, o diría un total que
       todavía no se ha terminado de listar. */
    const ultima = contador === totalHojas;
    /* Fondo de fila vía CSS en el <tr>, no texto — no puede desbordar
       nada, y print-color-adjust:exact (ver más arriba) ya garantiza que
       se imprima igual que se ve en pantalla. Total y Total Mtto se
       apagan a rayita en la tabla del cliente: son precio de venta, y
       esos renglones no tienen — ver "eso se separa" en calcularPoliza(). */
    const fuera = bloque.tono === 'cliente';
    const filas = grupo.map(r => `<tr${fuera ? ' class="fuera-alcance"' : ''}>
      <td class="ix">${r.nTabla}</td>
      <td class="cpt">${esc(r.concepto)}${r.marca?`<span class="marca"> — ${esc(r.marca)}</span>`:""}</td>
      <td class="c">${esc(r.cantidad)}</td>
      <td class="c">${esc(r.precioUnitario)}</td>
      <td class="c">${fuera ? '—' : esc(r.total)}</td>
      <td class="c">${esc(r.frecuencia)}</td>
      <td class="c">${fuera ? '—' : esc(r.totalMtto)}</td>
    </tr>`).join("");
    const cierre = ultima ? `
        <table class="totals">
          ${POLIZA.totales.descuento ? `
          <tr><td class="lbl">${esc(POLIZA.totales.etiquetaSubtotal)}</td><td class="val">${esc(POLIZA.totales.subtotal)}</td></tr>
          <tr><td class="lbl">${esc(POLIZA.totales.etiquetaDescuento)} ${esc(POLIZA.totales.descuento)}</td><td class="val">${esc(POLIZA.totales.signoDescuento)}${esc(POLIZA.totales.montoDescuento)}</td></tr>` : ''}
          <tr><td class="lbl">Precio Anual</td><td class="val">${esc(POLIZA.totales.anual)}</td></tr>
          <tr class="grand"><td class="lbl">Precio Mensual</td><td class="val">${esc(POLIZA.totales.mensual)}</td></tr>
        </table>
        <ul class="note">
          <li>${esc(POLIZA.pie.iva)}</li>
          <li>Vigencia: del ${esc(POLIZA.fechas.vigenciaInicio)} al ${esc(POLIZA.fechas.vigenciaFin)}.</li>
          <li>La póliza se contrata y se presta por un periodo anual de doce (12) meses, independientemente de que la facturación se realice de forma anual o mensual.</li>
          ${hayCliente ? `<li>Los equipos bajo "Alcance del cliente" (ver arriba) son responsabilidad del cliente y no están incluidos en el Precio Anual ni en el Precio Mensual de esta póliza.</li>` : ''}
        </ul>` : '';
    /* Va ANTES de la tabla, en CADA hoja del listado (no solo en la que trae el
       cierre) — el pedido fue que se note "en el listado de los conceptos" en
       vez de quedar solo en la letra chica de Consideraciones Relevantes,
       varias hojas después. Se apoya a propósito en evitarTraslapeConPie():
       ese corrector mide lo YA DIBUJADO y no asume los 23 renglones por hoja
       de arriba, así que si este aviso empuja la tabla y ya no caben las 23
       filas completas, el sobrante se corre solo a la hoja siguiente —igual
       que ya hace con cualquier diferencia de métricas de fuente entre
       máquinas—, sin que haya que recalibrar ningún tope a mano. */
    /* Acortada a propósito para caber en DOS renglones del recuadro, no tres
       — la versión larga y completa sigue en Consideraciones Relevantes
       (pageConsideraciones), esta es solo el aviso rápido junto al listado. */
    const avisoExclusion = `<div class="aviso-exclusion-tabla">
      <b>Exclusión:</b> piso, paredes, techos e instalaciones hidrosanitarias/hidráulicas — 100% responsabilidad
      del cliente, fuera de esta póliza.
    </div>`;
    return `<section class="page">
    <div class="sheet">
      ${sheetHead("Póliza de Mantenimiento")}
      <div class="body">
        ${avisoExclusion}
        <div class="bloque-tabla">
          <div class="tit-bloque ${bloque.tono}">${esc(TITULO_ALCANCE[bloque.tono])}</div>
          <table class="grid ${CLASE_ALCANCE[bloque.tono]}" data-filas="${grupo.length}">
            <colgroup>
              <col style="width:22.6pt"><col style="width:126.6pt"><col style="width:51.2pt">
              <col style="width:63.2pt"><col style="width:59pt"><col style="width:59.2pt">
              <col style="width:54.8pt">
            </colgroup>
            <thead><tr>
              <th class="ix">#</th><th class="cpt">Concepto</th>
              <th class="c">Cantidad</th><th class="c">Precio Unitario</th>
              <th class="c">Total</th><th class="c">Frecuencia</th><th class="c">Total Mtto</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        </div>${cierre}
      </div>
    </div>
    ${(() => {
      /* Rango "Equipos X–Y de N" para el pie: N es el total de ESA tabla
         (bloque.filas.length), no del documento completo — cada tabla ya
         tiene su propia numeración independiente. Se recalcula después
         desde el DOM ya estable (ver actualizarPiesDePoliza), así que esto
         solo es el valor de arranque antes de que evitarTraslapeConPie()
         corra. */
      const rango = bloque.hojas.length > 1 && grupo.length
        ? `Equipos ${grupo[0].nTabla}–${grupo[grupo.length-1].nTabla} de ${bloque.filas.length}` : '';
      return sheetFoot(rango);
    })()}
  </section>`;
  }).join("")).join("");
}

/* ================== DESCRIPCIÓN DE TRABAJOS ==================
   Una fila por concepto distinto —la app ya dedujo la lista—, y solo los que
   tienen texto: no se inventa el trabajo de un mantenimiento.

   Se pinta TODO en una hoja y después partirDescripcion() la reparte midiendo el
   alto real, porque estas filas no son de altura fija. */
function pageDescripcion(){
  if(!POLIZA.descripciones.length) return '';
  /* SIN columna de número. Iba 1–16 sobre conceptos DEDUPLICADOS mientras la
     tabla de renglones va 1–30 sobre renglones, y las dos encabezaban «#»: dos
     numeraciones distintas con el mismo nombre invitan a cruzarlas y no cuadran
     nunca. El equipo ya identifica la fila. */
  const filas = POLIZA.descripciones.map(d=>
    `<tr><td class="eq">${esc(d.concepto)}</td><td>${esc(d.texto)}</td></tr>`).join("");
  return `<section class="page" data-parte="descripcion">
    <div class="sheet">
      ${sheetHead("Descripción de Trabajos")}
      <div class="body">
        <table class="grid desc">
          <thead><tr><th>Equipo</th><th>Descripción del trabajo a realizar</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
    ${sheetFoot()}
  </section>`;
}

/* ============================ CALENDARIO ============================ */
function pageCalendario(){
  const th=MESES.map(m=>`<th>${esc(m)}</th>`).join("");
  /* r.columnas YA son índices de columna: mesesServicio son desfases desde el
     inicio de la vigencia, así que el valor guardado ES la columna. Aquí NO se
     rota nada — un % 12 de más movería todos los servicios de todos los
     renglones a la vez, sin error y sin aviso. */
  const hojas = partirEnHojas(POLIZA.renglones, RENGLONES_CALENDARIO_POR_HOJA);
  return hojas.map((grupo, h) => {
    const filas = grupo.map(r=>{
      const celdas=MESES.map((_,mi)=>`<td class="${r.columnas.includes(mi)?"on":""}"></td>`).join("");
      return `<tr><td class="ix">${r.n}</td><td class="lbl">${esc(r.concepto)}</td>${celdas}</tr>`;
    }).join("");
    return `<section class="page${SOLO_CALENDARIO ? ' horizontal' : ''}">
    <div class="sheet">
      ${sheetHead("Calendario de<br>Mantenimientos",true)}
      <div class="body" style="top:2.85in">
        <table class="cal" data-filas="${grupo.length}">
          <!-- Anchos MEDIDOS de las cotizaciones reales: la rejilla de meses son
               282.4 pt (12 × 23.53) y el # mide 7.4 pt. Concepto se queda con
               TODO lo que sobra, que es lo que evita que «Barra Caliente De
               Servicio Eléctrica» se parta en dos líneas. En pt y no en %:
               un porcentaje ata la rejilla al ancho de la hoja y el paso de
               23.53 dejaría de cumplirse. -->
          <colgroup><col style="width:14pt"><col>
            ${MESES.map(()=>'<col style="width:23.53pt">').join("")}</colgroup>
          <thead><tr><th class="ix"></th><th class="cpt">Concepto</th>${th}</tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
    ${sheetFoot(hojas.length > 1 ? `Equipos ${grupo[0].n}–${grupo[grupo.length-1].n} de ${POLIZA.renglones.length}` : '')}
  </section>`;
  }).join("");
}

/* ========================= CONSIDERACIONES ========================= */
function pageConsideraciones(){
  /* Las notas que se capturan en el formulario de la póliza (campo "Notas",
     opcional) — condiciones propias de ESTE contrato, no la letra chica
     genérica de abajo. Se imprimen primero y en negritas, para que salten a
     la vista antes que las cláusulas estándar. Si la póliza no trae notas,
     esta cláusula simplemente no aparece. */
  const notas = POLIZA && POLIZA.notas ? String(POLIZA.notas).trim() : '';
  const c=[
    /* Fija, en TODA póliza, sin depender de ningún dato capturado — a
       diferencia de "EXCLUSIONES DE INFRAESTRUCTURA" de abajo (que habla en
       general de cableado/tuberías/estructuras), esta cláusula nombra de
       forma explícita los cuatro rubros que Victor pidió dejar Siempre muy
       claros: piso, paredes, techos e instalaciones hidrosanitarias/
       hidráulicas son 100% responsabilidad del cliente, nunca de Forguard.
       Va primero, antes incluso de las notas propias del contrato, y con el
       mismo ámbar (#FDF4E5) que ya usa la tabla para marcar un renglón
       "responsabilidad del cliente" — para que salte a la vista igual que en
       el tablero. */
    {h:"OBRA CIVIL E INSTALACIONES: RESPONSABILIDAD 100% DEL CLIENTE",
     t:`<div class="aviso-exclusion"><p><b>Piso, paredes, techos, e instalaciones hidrosanitarias e hidráulicas del inmueble
        corresponden al 100% al cliente</b> — quedan siempre fuera del alcance de esta póliza, sin excepción. Forguard da
        mantenimiento únicamente a los equipos contratados que se listan en esta póliza; cualquier daño, falla, fuga o
        mantenimiento de la obra civil o de las instalaciones hidrosanitarias/hidráulicas del sitio corre por cuenta del
        cliente.</p></div>`},
    ...(notas ? [{h:"NOTAS DE ESTA PÓLIZA", p:`<b>${esc(notas).replace(/\n/g,'<br>')}</b>`}] : []),
    {h:"VISITAS NO PLANEADAS O PACTADAS (PRECIO ADICIONAL)",
     p:`<b>Aplicación:</b> toda visita solicitada por el cliente fuera del cronograma preventivo tendrá un precio adicional, excepto que sea por falla cubierta bajo garantía de reparación reciente (por ejemplo, dentro de los 15 días posteriores a una visita programada).`},
    {h:"EXCLUSIONES DE INFRAESTRUCTURA",
     t:`<table class="two-col"><tr>
        <td><b>No están cubiertos bajo esta póliza:</b>
          Daños a infraestructura ajena al equipo, como cableado eléctrico externo, tuberías y estructuras arquitectónicas. Software no incluido en el Anexo Técnico. Equipos periféricos no contratados, como sensores externos o UPS no cubiertos.</td>
        <td><b>Causas externas:</b>
          Fallas por voltaje inestable. Inundaciones, incendios, vandalismo o fuerza mayor.</td>
      </tr></table>`},
    {h:"CUMPLIMIENTO DE NORMATIVAS ESPECÍFICAS",
     p:`Esta póliza asegura el mantenimiento para la correcta operación de los equipos. <b>No incluye servicios específicos requeridos para el cumplimiento de normativas locales o certificaciones particulares</b> (por ejemplo, pruebas de emisiones, calibración de equipos de medición con certificación externa o inspecciones de seguridad especializadas) que no formen parte del mantenimiento preventivo estándar. Estos servicios pueden gestionarse por separado bajo solicitud del cliente.`},
    {h:"REPARACIONES MAYORES O SUSTITUCIÓN COMPLETA DE COMPONENTES PRINCIPALES",
     p:`Esta póliza cubre el mantenimiento preventivo y las reparaciones correctivas menores destinadas a mantener la operatividad básica de los equipos. <b>No incluye la sustitución completa de componentes principales</b> como compresores de refrigeración, quemadores industriales completos, tarjetas electrónicas principales (PLC, unidades de control), motores de gran potencia, ni cualquier otro componente cuyo precio individual exceda el monto acordado por las partes en pesos mexicanos (MXN). Estas sustituciones se cotizarán por separado y requerirán una orden de compra adicional aprobada por el cliente.`},
    {h:"TRABAJOS ESTÉTICOS O DE ACABADO",
     p:`Esta póliza se enfoca en el mantenimiento funcional de los equipos. <b>No incluye trabajos estéticos</b> como pintura, limpieza profunda no rutinaria (más allá de la necesaria para el mantenimiento técnico), pulido de acero inoxidable ni la reparación de daños superficiales que no afecten la operatividad del equipo.`},
    {h:"ACTUALIZACIÓN Y VIGENCIA",
     /* Aquí venía `${POLIZA.vigencia}` y salía «undefined» impreso al final del
        párrafo: ese campo existía en el contrato viejo del JSON del lector y NO
        está en el payload que arma armarPayloadPoliza. La cláusula de los doce
        meses ya se imprime en las notas de la tabla, con las fechas concretas
        de esta póliza, así que aquí no falta nada — sobraba. */
     p:`En caso de que el cliente solicite la incorporación o el retiro de equipos durante la vigencia, la póliza será actualizada para reflejar dichos cambios, lo cual podrá implicar un ajuste en el alcance y en el precio del servicio. Toda modificación deberá quedar debidamente documentada y aceptada por ambas partes.`}
  ].map(x=>`<div class="clause"><div class="hd">${x.h}</div>${x.t||`<p>${x.p}</p>`}</div>`).join("");

  return `<section class="page">
    <div class="sheet">
      ${sheetHead("Consideraciones Relevantes")}
      <div class="body">${c}</div>
    </div>
    ${sheetFoot()}
  </section>`;
}

/* ====================== SIN DATOS ======================
   La hoja que sale cuando el puente falló. Tiene que verse ROTA a propósito: un
   documento de aspecto perfecto con cifras inventadas es algo que se le puede
   mandar a un cliente sin que nadie lo note. Por eso aquí no hay caso demo. */
function pageSinDatos(motivo){
  return `<section class="page">
    <div class="sheet">
      <div class="logo-tl">${isotipo(44)}</div>
      <div class="wordmark-tr">${logotipo(116)}</div>
      <div class="h1 two">Sin datos</div>
      <div class="body">
        <p style="font-size:11px;line-height:1.6;color:#22282F;max-width:4.6in">
          Esta hoja se abrió sin recibir los datos del tablero, así que
          <b>no hay nada que imprimir</b>. ${esc(motivo || '')}
        </p>
        <p style="font-size:9.5px;line-height:1.6;color:#5C6673;max-width:4.6in;margin-top:14px">
          Se llega aquí abriendo el archivo directamente, recargando esta pestaña
          después de un rato, o si la pestaña se abrió perdiendo su
          <code>sessionStorage</code>. La salida es volver al tablero, entrar a la
          póliza y darle otra vez a imprimir.
        </p>
      </div>
    </div>
  </section>`;
}


/* ====================== HOJA DE CIERRE ======================
   Última hoja de todo documento (después de Consideraciones): solo el
   logo de Forguard, centrado — pedido de Victor (21-sep-2026, ya aplicado
   al documento de Imagen/Aperturas): "que la ultima hoja se vea como la
   de la portada pero sola y exclusivamente con el logotipo". */
function pageCierre(){
  return `<section class="page${SOLO_CALENDARIO ? ' horizontal' : ''}">
    <div class="sheet">
      <div class="pagina-cierre">${isotipo(64)}${logotipo(160)}</div>
    </div>
  </section>`;
}

/* Orden de hojas:
     Portada → Tabla → Descripción de Trabajos → Calendario → Consideraciones → Cierre.
   Consideraciones va justo antes del cierre porque es el único bloque de
   prosa de largo variable: si fuera antes de la tabla, agregar o quitar
   una cláusula correría el arranque de la tabla y cambiaría cuántas filas
   caben en la primera hoja.

   `POLIZA.vistaDocumento === 'calendario'` (agregado 24-sep-2026, pedido
   explícito de Victor: "un segmento donde podamos imprimir solamente el
   calendario, sin necesidad de tener que imprimir toda la póliza
   completa", y luego "en el título coloca que es solo el calendario" +
   "que las hojas sean en horizontal para mejor visibilidad"): una portada
   propia, más simple (pageCoverCalendario, no la réplica medida de
   pageCover — ver el comentario de .cover-calendario), y todo el
   documento en horizontal (SOLO_CALENDARIO agrega la clase .horizontal a
   cada hoja; el @page de impresión se resuelve aparte, más abajo) — sin
   Tabla, Descripción ni Consideraciones. Reusa pageCalendario() tal cual:
   la lógica del Gantt (partirEnHojas, columnas ya resueltas) no se
   duplicó para esto, nada más se benefician solas del ancho extra que da
   el horizontal (la columna de Concepto es flexible, ver su comentario). */
/* Con try/catch A PROPÓSITO: leerPayload() valida renglones, calendario y
   totales, pero el render toca muchos más campos (cliente, contacto, vendedor,
   fechas, pie…) y un payload al que le falte cualquiera dejaba la página EN
   BLANCO con el botón «Guardar como PDF» vivo — un PDF de páginas vacías con
   cara de bug. Roto el armado, se enseña la hoja de «Sin datos» con el motivo,
   igual que cuando no llegan datos. */
let docRoto = null, docHTML = '';
if(POLIZA){
  try{
    docHTML = SOLO_CALENDARIO
      ? pageCoverCalendario() + pageCalendario() + pageCierre()
      : pageCover() + pagePoliza() + pageDescripcion() + pageCalendario() + pageConsideraciones() + pageCierre();
  }catch(e){
    docRoto = e;
    console.error('El documento no se pudo armar:', e);
  }
}
document.getElementById("doc").innerHTML = (POLIZA && !docRoto)
  ? docHTML
  : pageSinDatos(docRoto
      ? 'Los datos llegaron incompletos y el documento no se pudo armar. Cierra esta pestaña y vuelve a abrirlo desde el tablero.'
      : LEIDO.error);

if(POLIZA && !docRoto) document.title = (SOLO_CALENDARIO ? 'Calendario · Póliza ' : 'Póliza ') + (POLIZA.cliente.sitio || POLIZA.cliente.nombre || '') + ' · Forguard';

/* El papel de este documento se define en @page (más arriba, dentro de
   @media print) — pero UNA sola hoja HTML sirve el documento completo
   (portrait) y el "solo calendario" (horizontal), y @page no se puede
   acotar con un selector de clase. Como los dos nunca conviven en la
   misma pestaña (cada apertura es UN documento, con SU payload), basta
   con inyectar aquí, en el momento en que ya se sabe cuál es, la regla
   que corresponde — la que se agrega DESPUÉS en el DOM gana el empate de
   especificidad contra la del <style> original. */
if(SOLO_CALENDARIO){
  const estiloHorizontal = document.createElement('style');
  estiloHorizontal.textContent = '@media print{ @page{ size:letter landscape; margin:0; } }';
  document.head.appendChild(estiloHorizontal);
}
/* Sin documento no hay nada que imprimir: el banner de ajustes sobraría y
   hasta confundiría — se quita del DOM, no solo de la vista. */
if(!POLIZA || docRoto){ const av = document.getElementById('avisoImpresion'); if(av) av.remove(); }

/* --- La descripción se parte MIDIENDO, no contando ---
   Sus filas son de altura variable —19.8 a 28.0 pt en los documentos reales—
   porque el texto del mantenimiento es largo y envuelve. Un tope de filas por
   hoja se pasaría con textos largos y desperdiciaría media hoja con cortos. Así
   que se pinta todo y aquí se reparte según lo que de verdad ocupó. */
function partirDescripcion(){
  const pagina = document.querySelector('[data-parte="descripcion"]');
  if(!pagina) return;
  /* SIEMPRE 'table.grid.desc tbody', nunca un 'tbody' pelón: el encabezado de la
     hoja lleva su propia <table class="metabar"> y el navegador le inserta un
     <tbody> implícito, así que un querySelector('tbody') devuelve ESE y no el de
     las descripciones. Con eso el molde no se vaciaba y la segunda hoja salía
     con la lista completa repetida. */
  const TB = 'table.grid.desc tbody';
  const filas = [...pagina.querySelectorAll(TB + ' tr')];
  if(!filas.length) return;

  /* Se mide UNA vez, con todo pintado, y se decide el reparto completo antes de
     tocar el DOM. Una versión anterior clonaba la hoja dentro de un bucle y se
     desbocó: 616 filas donde había 16. Medir primero y repartir después no tiene
     ese modo de fallar. */
  const arranque = pagina.querySelector('.body').getBoundingClientRect().top;
  /* El techo del pie se MIDE, no se estima. Con una reserva de 64 px a ojo, la
     hoja 1 de la descripción de MXNL02 metía 14 filas y la última se encimaba
     22 px con el bloque de Teléfono/Correo/Oficinas: el pie quedaba escrito
     encima del texto y salía así en el PDF. El pie real ocupa 102 px (58 de alto
     más 44 de su `bottom:.46in`), y medirlo aguanta que cambie de tamaño. Los
     +6 son aire para que no se toquen. */
  const pie = pagina.querySelector('.footwrap');
  const limite = pie
    ? pie.getBoundingClientRect().top - 6
    : pagina.getBoundingClientRect().bottom - 102;
  const alturaCabeza = pagina.querySelector('table.grid.desc thead').getBoundingClientRect().height;
  const disponible = limite - arranque - alturaCabeza;
  const altos = filas.map(f => f.getBoundingClientRect().height);

  const grupos = [[]];
  let usado = 0;
  filas.forEach((f, i) => {
    if(usado + altos[i] > disponible && grupos[grupos.length-1].length){
      grupos.push([]); usado = 0;
    }
    grupos[grupos.length-1].push(f); usado += altos[i];
  });
  if(grupos.length < 2) return;                 /* cabe entera */

  const molde = pagina.cloneNode(true);         /* una plantilla vacía, UNA vez */
  molde.querySelector(TB).innerHTML = '';
  let anterior = pagina;
  grupos.slice(1).forEach(grupo => {
    const hoja = molde.cloneNode(true);
    const tb = hoja.querySelector(TB);
    grupo.forEach(f => tb.appendChild(f));      /* appendChild MUEVE, no copia */
    anterior.after(hoja);
    anterior = hoja;
  });
}

/* --- El corrector: mide lo YA DIBUJADO y empuja lo que se encima ---
   partirDescripcion() y los topes de 23 y 21 filas son PREDICCIONES: calculan
   dónde debería cortar antes de dibujar. Y una predicción puede fallar por cosas
   que no controlamos —métricas de fuente de cada máquina, un tamaño mínimo de
   letra configurado en el navegador, un concepto larguísimo que envuelve—. Le
   pasó a Santiago: en su Chrome cabía una fila más que en el mío y el pie le
   quedaba escrito encima del texto, en el papel que se le manda al cliente.

   Esto no predice: recorre las hojas ya pintadas y, mientras la última fila de
   una tabla invada el pie, la MUEVE a la hoja siguiente —creándola si no
   existe—. Al final vuelve a medir. Sirve para las tres tablas y para cualquier
   póliza futura, sin volver a calibrar un tope a mano.

   Se hace UNA sola pasada de trabajo por hoja con un guardián de vueltas: mover
   filas dentro de un bucle que remide es exactamente como se desbocó la primera
   versión de la paginación (616 filas donde había 16). */
/* La tabla de equipos ahora son DOS tablas reales (.alcance-forguard y
   .alcance-cliente, ver pagePoliza()) en vez de una sola con un renglón
   divisor — cada una necesita su PROPIA entrada aquí. Si se usara una sola
   entrada genérica 'table.grid:not(.desc) tbody', el bucle de abajo trataría
   la última hoja de Forguard y la primera del cliente como continuación de
   LA MISMA tabla (cuerpos[i+1]) y podría empujar un equipo de Forguard hacia
   la tabla del cliente. Con selectores separados, el corrector solo mueve
   filas dentro de su propia tabla. */
const TABLAS = [
  { tb:'table.grid.desc tbody', tabla:'table.grid.desc' },
  { tb:'table.grid.alcance-forguard tbody', tabla:'table.grid.alcance-forguard' },
  { tb:'table.grid.alcance-cliente tbody', tabla:'table.grid.alcance-cliente' },
  { tb:'table.cal tbody', tabla:'table.cal' }
];

function hojaDe(el){ return el.closest('.page'); }

function nuevaHojaComo(hoja, selTabla, selTb){
  /* Clona la hoja, le vacía la tabla y le quita el bloque de cierre —Precio
     Anual y las notas van SOLO en la última—; después se le devuelve. */
  const nueva = hoja.cloneNode(true);
  nueva.querySelector(selTb).innerHTML = '';
  const cierre = nueva.querySelectorAll('.totals, .note');
  cierre.forEach(c => c.remove());
  hoja.after(nueva);
  return nueva;
}

function evitarTraslapeConPie(){
  let guardia = 0, hubo = true;
  while(hubo && guardia++ < 80){
    hubo = false;
    for(const { tb, tabla } of TABLAS){
      const cuerpos = [...document.querySelectorAll(tb)];
      for(let i = 0; i < cuerpos.length; i++){
        const cuerpo = cuerpos[i];
        const hoja = hojaDe(cuerpo);
        const pie = hoja && hoja.querySelector('.footwrap');
        if(!pie) continue;
        const techo = pie.getBoundingClientRect().top - 4;
        const filas = [...cuerpo.children];
        /* Nunca se deja una hoja sin ninguna fila: si ni una cabe, el problema
           es de otro tamaño y lo va a gritar la aserción. */
        if(filas.length < 2) continue;
        const ultima = filas[filas.length - 1];
        if(ultima.getBoundingClientRect().bottom <= techo) continue;

        /* Se encima: a la hoja siguiente del mismo tipo, o a una nueva. */
        const siguiente = cuerpos[i + 1] || nuevaHojaComo(hoja, tabla, tb).querySelector(tb);
        siguiente.insertBefore(ultima, siguiente.firstChild);
        hubo = true;
      }
    }

    /* Las filas pueden caber TODAS y aun así el papel salir roto: el bloque de
       cierre —Precio Anual y las notas— vive DESPUÉS de la tabla, y aquí solo
       se medían filas. Con 19 o 20 renglones en la última hoja las notas se
       imprimían ENCIMA del teléfono del pie, sin banda y sin error (medido:
       12.3 pt de invasión); con 21–23, las filas de totales disparaban la banda
       roja sobre una póliza perfectamente válida que el corrector nunca iba a
       arreglar. Se mide el FINAL del cierre (las notas si hay, si no los
       totales) y, mientras invada, la última fila de la última hoja de la
       tabla se va a una hoja nueva; reubicarCierre() se lleva el cierre detrás
       en la siguiente vuelta y el while remide. Con descuento el cierre trae
       dos filas más y el umbral se adelanta ~2 renglones: por eso se mide, no
       se calibra otro tope a mano. */
    const c = reubicarCierre();
    if(c){
      const hojaCierre = hojaDe(c.cierre);
      const pieCierre = hojaCierre && hojaCierre.querySelector('.footwrap');
      const fin = (c.notas || c.cierre).getBoundingClientRect().bottom;
      if(pieCierre && fin > pieCierre.getBoundingClientRect().top - 4){
        const cuerpos = document.querySelectorAll('table.grid:not(.desc) tbody');
        const ultimo = cuerpos[cuerpos.length - 1];
        const filas = ultimo ? [...ultimo.children] : [];
        /* Con una sola fila no se mueve nada: quedaría una tabla vacía, y si un
           cierre no cabe ni con una fila el problema es de otro tamaño — lo va
           a gritar la aserción, que ahora sí cuenta el cierre. */
        if(filas.length >= 2){
          const nueva = nuevaHojaComo(hojaDe(ultimo), 'table.grid:not(.desc)', 'table.grid:not(.desc) tbody');
          nueva.querySelector('table.grid:not(.desc) tbody').appendChild(filas[filas.length - 1]);
          hubo = true;
        }
      }
    }
  }
  reubicarCierre();   /* por si la última vuelta creó hoja y el while ya no remidió */
}

/* El bloque de cierre de la tabla tiene que acabar en la ÚLTIMA hoja de la
   tabla: si el corrector creó una hoja nueva después, se lo lleva. Devuelve el
   cierre y las notas para que quien llama pueda medirlos ya reubicados. */
function reubicarCierre(){
  const cierres = document.querySelectorAll('.totals');
  if(!cierres.length) return null;
  const cierre = cierres[cierres.length - 1];
  let notas = cierre.parentNode.querySelector('.note');
  const tablas = document.querySelectorAll('table.grid:not(.desc)');
  const ultimaTabla = tablas[tablas.length - 1];
  const cuerpoDeLaUltima = ultimaTabla && ultimaTabla.closest('.body');
  if(cuerpoDeLaUltima && cierre.parentNode !== cuerpoDeLaUltima){
    cuerpoDeLaUltima.appendChild(cierre);
    if(notas) cuerpoDeLaUltima.appendChild(notas);
  }
  return { cierre, notas };
}

/* El pie "Equipos X–Y de N" de cada hoja se escribe en el HTML ANTES de que
   evitarTraslapeConPie() reacomode filas entre hojas. Forguard y cliente ya
   siempre arrancan en su propia hoja (ver pagePoliza()), pero cada tabla
   puede SEGUIR ocupando varias hojas por sí sola, y el título+encabezado de
   columnas de esa tabla cuenta como overhead extra en la primera hoja de
   cada una — así que el reacomodo dinámico puede correr renglones entre
   esas hojas igual que antes. Sin este repaso, el pie de una hoja podría
   seguir anunciando un rango de equipos que ya no es el que esa hoja
   imprime de verdad, una vez que el corrector terminó de mover filas. Se
   recalcula desde el DOM ya estable, por hoja y por tabla de alcance — sin
   tocar sheetFoot() (la usan también Calendario, Descripción y el resto de
   los documentos, que no tienen este problema porque su tabla nunca se
   divide en dos). */
function actualizarPiesDePoliza(){
  const paginasConTabla = [...document.querySelectorAll('.page')].filter(pg => pg.querySelector('.bloque-tabla'));
  if(!paginasConTabla.length) return;
  const totalPorTono = {
    forguard: POLIZA.renglones.filter(r => r.alcance !== 'cliente').length,
    cliente: POLIZA.renglones.filter(r => r.alcance === 'cliente').length
  };
  const tonoDe = pg => pg.querySelector('table.alcance-cliente') ? 'cliente' : 'forguard';
  /* El rango solo tiene sentido si ESA tabla (no el documento completo)
     necesitó más de una hoja: si Forguard cupo entera en una sola hoja, no
     hay "resto" que anunciar solo porque la tabla del cliente haya caído
     en otra hoja aparte. */
  const paginasPorTono = { forguard: 0, cliente: 0 };
  paginasConTabla.forEach(pg => paginasPorTono[tonoDe(pg)]++);

  paginasConTabla.forEach(pg => {
    const tag = pg.querySelector('.footwrap .tag');
    if(!tag) return;
    const tono = tonoDe(pg);
    let rango = '';
    if(paginasPorTono[tono] > 1){
      const nums = [...pg.querySelectorAll('tbody tr td.ix')].map(td => td.textContent.trim());
      if(nums.length) rango = `Equipos ${nums[0]}–${nums[nums.length-1]} de ${totalPorTono[tono]}`;
    }
    tag.innerHTML = (rango ? `<div style="color:#5C6673;font-size:8px;text-align:right;padding-bottom:6px">${esc(rango)}</div>` : '') + 'Sostenemos a los que sostienen todo.';
  });
}

/* --- La aserción que se queda para siempre ---
   Cuenta los renglones REALMENTE IMPRESOS en todas las hojas y los compara con
   los del payload. Es la red que faltaba: la tabla tenía overflow:hidden y
   MXGT01 salía con 27 de sus 36 equipos, con la hoja viéndose llena y bien
   formada. Un recorte silencioso en un papel que va al cliente no lo cacha nadie
   revisando el diff — solo lo cacha contar.

   Si no cuadra, NO se falla en silencio: se pinta una banda roja hasta arriba y
   se imprime también en el papel. Vale mil veces más un documento que se ve roto
   que uno que se ve bien y le faltan nueve equipos. */
function verificarRenglonesImpresos(){
  /* table.grid:not(.desc) ahora son DOS tablas (.alcance-forguard y
     .alcance-cliente, ver pagePoliza()) — el selector las junta a ambas,
     así que sigue comparando contra el total de POLIZA.renglones sin
     cambios. Ya no hay renglones "divisores" que excluir: el título de
     cada tabla vive fuera del <tbody>, como bloque, no como <tr>. */
  const cuenta = sel => [...document.querySelectorAll(sel)]
    .reduce((t, tb) => t + tb.querySelectorAll('tr').length, 0);
  /* Con `vistaDocumento === 'calendario'` (ver el armado de docHTML, más
     arriba) la Tabla y la Descripción NUNCA se imprimen A PROPÓSITO — no
     es un documento incompleto, es el documento que se pidió. Comparar
     esas dos contra POLIZA.renglones/descripciones ahí prendería la banda
     roja de "MAL FORMADO" sobre un documento perfectamente válido, así que
     esas dos pruebas se saltan en ese modo; el calendario en sí SIEMPRE se
     verifica, sea cual sea la vista. */
  const soloCalendario = POLIZA.vistaDocumento === 'calendario';
  const pruebas = [
    { que:'renglones del calendario',   impreso: cuenta('table.cal tbody'),             esperado: POLIZA.renglones.length },
    ...(soloCalendario ? [] : [
      { que:'renglones de la tabla',    impreso: cuenta('table.grid:not(.desc) tbody'), esperado: POLIZA.renglones.length },
      { que:'filas de la descripción',  impreso: cuenta('table.grid.desc tbody'),       esperado: POLIZA.descripciones.length }
    ])
  ];
  const mal = pruebas.filter(p => p.impreso !== p.esperado);

  /* Y que NADA se encime con el pie. El conteo por sí solo no lo veía: las filas
     estaban todas impresas, solo que una encima del telefono. Se revisa después
     del corrector, así que si esto salta es que ni corrigiendo cupo. */
  let encimadas = 0;
  document.querySelectorAll('.page').forEach(pg => {
    const pie = pg.querySelector('.footwrap');
    if(!pie) return;
    const techo = pie.getBoundingClientRect().top;
    pg.querySelectorAll('.body tbody tr').forEach(tr => {
      if(tr.getBoundingClientRect().bottom > techo + 1) encimadas++;
    });
    /* Las notas del cierre son un <ul>, no filas: para este conteo eran
       invisibles, y por eso el traslape con 19–20 renglones salía impreso EN
       SILENCIO. El bloque de totales entra completo por la misma razón. */
    pg.querySelectorAll('.body .note, .body .totals').forEach(el => {
      if(el.getBoundingClientRect().bottom > techo + 1) encimadas++;
    });
  });
  if(encimadas) mal.push({ que:'bloques encimados con el pie', impreso: encimadas, esperado: 0 });

  if(!mal.length){ console.info('Documento completo:', pruebas.map(p=>`${p.que} ${p.impreso}/${p.esperado}`).join(' · ') + ' · sin traslapes'); return true; }

  const aviso = document.createElement('div');
  /* Bloque normal, no sticky: sticky no se imprime en algunos navegadores y este
     aviso tiene que salir EN EL PAPEL, que es donde el error hace daño. Que
     además descuadre la primera hoja es lo de menos — es justo lo que se busca. */
  aviso.setAttribute('style',
    'background:#B3312C;color:#fff;padding:14px 18px;margin:0 auto 8px;max-width:8.5in;'
  + 'font:700 13px/1.5 Poppins,Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact');
  aviso.innerHTML = 'ESTE DOCUMENTO ESTÁ MAL FORMADO — NO LO MANDES.<br>'
    + mal.map(p => p.esperado === 0
        ? `Hay ${p.impreso} ${p.que}.`
        : `Se imprimieron ${p.impreso} ${p.que} de ${p.esperado}.`).join('<br>');
  document.getElementById('doc').prepend(aviso);
  console.error('Documento incompleto', mal);
  return false;
}

/* --- CUÁNDO se acomoda el documento ---
   No basta con hacerlo al final del script: en ese momento las fuentes
   embebidas pueden no haber asentado, y si asientan después las filas cambian
   de alto y el reparto que se acaba de calcular queda viejo. Se acomoda:

     1. Al cargar, ya con document.fonts.ready — el momento en que los altos son
        los definitivos.
     2. Otra vez en 'beforeprint', porque imprimir vuelve a maquetar y es el
        único momento que de verdad importa: el papel es lo que ve el cliente.

   La red del setTimeout no es adorno: fonts.ready NO resuelve en una pestaña de
   fondo, y sin ella el documento se quedaría sin acomodar para siempre. Es la
   misma trampa que ya está documentada para las animaciones.

   `acomodando` evita que las dos entradas se pisen, y partirDescripcion() ya
   sale sola si la descripción cabe entera, así que repetir es barato. */
let acomodando = false;
function acomodarDocumento(){
  if(!POLIZA || docRoto || acomodando) return;
  acomodando = true;
  try{
    partirDescripcion();
    evitarTraslapeConPie();
    actualizarPiesDePoliza();
    verificarRenglonesImpresos();
  } finally { acomodando = false; }
}

if(POLIZA){
  let yaCorrio = false;
  const unaVez = () => { if(yaCorrio) return; yaCorrio = true; acomodarDocumento(); };
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(unaVez);
    setTimeout(unaVez, 1200);          /* pestaña de fondo: fonts.ready no llega */
  } else {
    unaVez();
  }
  /* Imprimir vuelve a maquetar: se revisa otra vez justo antes. */
  addEventListener('beforeprint', acomodarDocumento);
}
</script>
</body>
</html>
