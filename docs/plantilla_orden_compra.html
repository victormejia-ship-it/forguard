    --text:#22282F; --muted:#9AA1AB; --rule:#DFE3E8; --rule-strong:#C9CFD6;
    --zebra:#F5F7F9;
  }
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:#E9EBEE;font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;}

  .page{position:relative;width:8.5in;height:11in;margin:22px auto;background:#fff;
    box-shadow:0 4px 24px rgba(8,25,75,.15);}
  .sheet{position:absolute;top:0;right:0;bottom:0;left:0;padding:.62in .72in;}

  .logo-tl{color:var(--brand-navy);}
  .wordmark-tr{color:var(--brand-navy);line-height:0;}
  .cab{display:flex;justify-content:space-between;align-items:flex-start;}
  .cab-tit{margin-top:26px;}
  .eyebrow{font-size:9px;color:#5C6673;letter-spacing:.3px;text-transform:uppercase;}
  .h1{font-family:var(--font-body);font-weight:300;font-size:26px;line-height:1.15;
      letter-spacing:-.4px;color:var(--title);margin-top:5px;}

  .metabar{margin-top:20px;font-size:9.5px;border-collapse:collapse;width:100%;}
  .metabar td{padding:0 22px 10px 0;vertical-align:top;}
  .metabar .k{color:var(--label-blue);padding-bottom:3px;font-weight:600;}
  .metabar .v{color:var(--text);font-weight:600;}

  .franja-equipo{margin-top:14px;padding:8px 10px;background:var(--zebra);border-radius:4px;font-size:9.5px;color:var(--text);}
  .franja-equipo .k{color:var(--label-blue);font-weight:600;margin-right:6px;}

  .cuerpo{margin-top:14px;}

  table.grid{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.grid thead th{font-size:8px;font-weight:700;color:#2B3341;text-align:center;
    text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;
    border-bottom:1.2px solid var(--rule-strong);}
  table.grid thead th.cpt{text-align:left;}
  table.grid tbody td{font-size:9.5px;padding:6px 4px;border-bottom:1px solid var(--rule);
    vertical-align:top;text-align:center;}
  table.grid tbody td.cpt{text-align:left;font-weight:500;}
  table.grid tbody td.cpt .parte{font-size:7.5px;font-weight:400;color:#8A929D;margin-top:1px;}
  table.grid tbody td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.grid tbody tr.grupo td{background:var(--zebra);font-weight:700;text-transform:uppercase;
    font-size:8.5px;letter-spacing:.02em;padding:7px 4px;}
  table.grid tbody tr.instalacion td{font-weight:700;border-top:1.4px solid var(--rule-strong);}

  .totales{margin-top:14px;width:100%;}
  .totales td{font-size:11px;padding:5px 9px;}
  .totales .lbl{text-align:right;color:#2B3341;font-weight:600;}
  .totales .val{text-align:right;width:1.5in;font-variant-numeric:tabular-nums;}
  .totales tr.gran td{font-weight:700;border-top:1px solid var(--rule-strong);font-size:14px;
    color:var(--brand-navy);padding-top:9px;}

  .notas{margin-top:16px;font-size:8.5px;color:#5C6673;line-height:1.6;white-space:pre-wrap;}
  .nota-importante{margin-top:14px;font-size:7.8px;color:#7a2c28;line-height:1.55;}
  .nota-importante ul{margin:4px 0 0 14px;padding:0;}
  .nota-importante li{margin-bottom:2px;}

  .footwrap{position:absolute;left:.72in;right:.72in;bottom:.46in;}
  .foot{width:100%;table-layout:fixed;border-collapse:collapse;}
  .foot td{font-size:8px;color:var(--muted);line-height:1.45;vertical-align:bottom;word-wrap:break-word;}
  .foot .k{font-weight:700;color:#8A929D;display:block;}
  .foot .tag{text-align:right;font-size:10px;color:#2E4E96;}

  .banda-roja{background:#a5322e;color:#fff;font-size:11px;padding:8px 14px;text-align:center;
    font-weight:700;}

  .aviso-impresion{position:fixed;top:0;left:0;right:0;z-index:50;
    background:#0E1116;color:#fff;font-family:var(--font-body);font-size:12.5px;line-height:1.5;
    padding:9px 18px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    display:flex;gap:8px 16px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .aviso-impresion button{font-family:var(--font-body);font-size:13px;font-weight:700;color:#06281a;
    background:#54C682;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;}
  .aviso-impresion button:hover{background:#7EE2A8;}
  .aviso-impresion .pista{color:#9FB3DC;}

  .error-doc{max-width:520px;margin:80px auto;text-align:center;font-size:15px;color:#7a2c28;}

  @media print{
    body{background:#fff;}
    .page{margin:0;box-shadow:none;page-break-after:always;}
    @page{size:letter;margin:0;}
    .aviso-impresion{display:none;}
  }
</style>
</head>
<body>
<div class="aviso-impresion" id="avisoImpresion">
  <button type="button" onclick="window.print()">Guardar como PDF</button>
  <span class="pista">si sale una impresora, cambia el destino a «Guardar como PDF»</span>
</div>
<div id="doc"></div>

<script>
/* ==================== DATOS ====================
   El tablero deja aquí el documento YA RESUELTO, en sessionStorage
   (armarPayloadOrdenCompra() en index.html). Esta plantilla FORMATEA Y
   CONCATENA: no multiplica ni suma nada — mismo principio que la plantilla
   de pólizas y cotizaciones.

   Si no hay datos NO se pinta un caso demo: una hoja que dice «Sin datos»
   vale más que un documento de aspecto perfecto con cifras inventadas. */
const LLAVE_DOC = 'forguard.documento.ordenCompra';

function leerPayload(){
  let crudo = null;
  try{ crudo = sessionStorage.getItem(LLAVE_DOC); }
  catch(e){ return { error:'El navegador no dejó leer los datos de la pestaña.' }; }
  if(!crudo) return { error:'No llegaron datos del tablero. Abre este documento con el botón "PDF para el proveedor" de la orden de compra, no directamente.' };
  let d;
  try{ d = JSON.parse(crudo); }
  catch(e){ return { error:'Los datos llegaron dañados y no se pudieron leer.' }; }
  if(!d || !Array.isArray(d.renglones) || !d.total)
    return { error:'Los datos llegaron incompletos.' };
  return { doc:d };
}

const LEIDO = leerPayload();
const COT = LEIDO.doc || null;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const ISOTIPO_VB="2.40 2.45 59.06 97.93", ISOTIPO_RATIO=0.6031;
const LOGOTIPO_VB="83.14 20.52 248.96 55.66", LOGOTIPO_RATIO=4.4729;
const ISOTIPO_PATHS=`<path fill="currentColor" d="M19.18,56l42.07-28.53c.13-.09.21-.24.21-.4v-6.1c0-.39-.43-.62-.76-.4l-42.07,28.53c-.13.09-.21.24-.21.4v6.1c0,.39.43.62.76.4Z"/> <path fill="currentColor" d="M60.71,2.53L18.42,31.04l-14.69,9.9c-.83.56-1.33,1.49-1.33,2.49v32.08c0,4.3,2.21,6.54,4.11,7.67l10.84,7.42c.33.22.69.37,1.06.45.21.05.42.08.64.08.6,0,1.21-.18,1.72-.54l24.95-17.44c.13-.09.21-.24.21-.4v-6.16c0-.39-.44-.62-.76-.39l-26.14,18.28-.62-.42-8.59-5.88c-.06-.04-.13-.09-.2-.12-.63-.36-1.21-.92-1.21-2.52v-30.48l2.58-1.74,2.41-1.63,5-3.37L61.24,9.43c.13-.09.21-.24.21-.4V2.93c0-.38-.43-.61-.75-.4Z"/> <path fill="currentColor" d="M56.68,39.93l-27.16,19.4h0l-10.86,7.76c-.15.11-.24.28-.24.47v5.96c0,.47.53.75.92.47l10.74-7.67h0s25.18-17.98,25.18-17.98c.07-.05.17,0,.17.09v27.09c0,1.04-.51,2.02-1.32,2.59l-26.6,18.43c-.33.23-.33.71,0,.94l4.1,2.8c.2.13.46.13.65,0l25.28-17.24c.62-.44,1.17-.95,1.66-1.51,1.42-1.66,2.24-3.78,2.24-6.01v-37.41c0-.67-.76-1.06-1.3-.67l-3.45,2.49Z"/>`;
const LOGOTIPO_PATHS=`<path fill="currentColor" d="M111.21,48.96h-16.82v15.73h-11.25V22.34h29.89v9.68h-18.63v7.26h16.82v9.68Z"/> <path fill="currentColor" d="M115.32,51.86v-7.02c0-1.74.25-3.36.75-4.87.5-1.51,1.31-2.94,2.42-4.29s2.73-2.42,4.87-3.21c2.14-.79,4.68-1.18,7.62-1.18s5.48.39,7.62,1.18c2.14.79,3.77,1.86,4.9,3.21,1.13,1.35,1.94,2.77,2.42,4.27.48,1.49.73,3.13.73,4.9v7.02c0,1.77-.24,3.41-.73,4.9-.48,1.49-1.29,2.91-2.42,4.27-1.13,1.35-2.76,2.42-4.9,3.21-2.14.79-4.68,1.18-7.62,1.18s-5.49-.39-7.62-1.18c-2.14-.79-3.76-1.86-4.87-3.21s-1.92-2.78-2.42-4.29c-.5-1.51-.75-3.14-.75-4.87ZM136.01,51.98v-7.26c0-3.19-1.67-4.78-5.02-4.78s-5.02,1.59-5.02,4.78v7.26c0,3.19,1.67,4.78,5.02,4.78s5.02-1.59,5.02-4.78Z"/> <path fill="currentColor" d="M161.42,64.69h-10.65v-32.67h9.44l.66,4.72c2.02-3.47,5.83-5.2,11.44-5.2v9.98h-2c-3.11,0-5.37.59-6.78,1.78-1.41,1.19-2.12,3.06-2.12,5.59v15.79Z"/> <path fill="currentColor" d="M189.49,76.18c-5.08,0-8.82-1.01-11.22-3.03-2.4-2.02-3.6-4.66-3.6-7.92v-.18h9.98v.18c0,1.86,1.58,2.78,4.72,2.78s4.78-1.37,4.78-4.11v-5.63c-2.02,2.62-4.9,3.93-8.65,3.93-3.55,0-6.4-1.13-8.56-3.39-2.16-2.26-3.24-5.45-3.24-9.56v-5.02c0-4.11,1.08-7.3,3.24-9.56,2.16-2.26,5.01-3.39,8.56-3.39,1.94,0,3.74.39,5.41,1.18,1.68.79,2.98,1.95,3.9,3.48l.55-3.93h9.44v30.86c0,4.19-1.26,7.46-3.78,9.8-2.52,2.34-6.36,3.51-11.53,3.51ZM189.01,53.07c3.43,0,5.14-1.92,5.14-5.75v-1.21c0-3.83-1.72-5.75-5.14-5.75-1.69,0-2.89.49-3.6,1.48-.71.99-1.06,2.41-1.06,4.27v1.21c0,1.86.35,3.28,1.06,4.27.71.99,1.91,1.48,3.6,1.48Z"/> <path fill="currentColor" d="M230.75,64.69l-.6-4.11c-.89,1.58-2.16,2.78-3.81,3.6-1.65.83-3.43,1.24-5.32,1.24-3.43,0-6.19-1.01-8.29-3.02-2.1-2.02-3.15-4.88-3.15-8.59v-21.78h10.65v19.06c0,1.66.31,2.89.94,3.69.62.81,1.74,1.21,3.36,1.21,1.89,0,3.21-.56,3.93-1.69s1.09-2.84,1.09-5.14v-17.12h10.65v32.67h-9.44Z"/> <path fill="currentColor" d="M263.91,64.69l-.48-3.27c-1.61,2.66-4.56,3.99-8.83,3.99-3.79,0-6.56-.89-8.32-2.66-1.75-1.77-2.63-4.19-2.63-7.26,0-6.65,3.89-9.98,11.68-9.98h7.38v-1.94c0-2.74-1.33-4.11-3.99-4.11s-4.05.93-4.05,2.78v.48h-9.98v-.48c0-3.23,1.19-5.86,3.57-7.9,2.38-2.04,5.97-3.06,10.77-3.06,9.56,0,14.34,4.24,14.34,12.71v20.69h-9.44ZM257.62,57.37c1.53,0,2.76-.4,3.69-1.21.93-.81,1.39-1.91,1.39-3.33v-.3h-5.69c-1.77,0-2.66.85-2.66,2.54,0,1.53,1.09,2.3,3.27,2.3Z"/> <path fill="currentColor" d="M288.78,64.69h-10.65v-32.67h9.44l.66,4.72c2.02-3.47,5.83-5.2,11.44-5.2v9.98h-2c-3.11,0-5.37.59-6.78,1.78-1.41,1.19-2.12,3.06-2.12,5.59v15.79Z"/> <path fill="currentColor" d="M322.66,64.69l-.61-4.17c-.89,1.57-2.17,2.78-3.84,3.63-1.68.84-3.48,1.27-5.41,1.27-3.55,0-6.4-1.13-8.56-3.39-2.16-2.26-3.24-5.45-3.24-9.56v-8.23c0-4.11,1.08-7.3,3.24-9.56,2.16-2.26,5.01-3.39,8.56-3.39,3.79,0,6.68,1.25,8.65,3.75v-14.52h10.65v44.16h-9.44ZM316.3,55.98c1.94,0,3.28-.56,4.02-1.69.75-1.13,1.12-2.84,1.12-5.14v-1.63c0-2.3-.37-4.01-1.12-5.14-.75-1.13-2.09-1.69-4.02-1.69-1.77,0-2.99.51-3.66,1.54-.66,1.03-1,2.59-1,4.69v2.84c0,2.1.33,3.66,1,4.69.66,1.03,1.88,1.54,3.66,1.54Z"/>`;

function isotipo(alto){
  const ancho=(alto*ISOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${ISOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${ISOTIPO_PATHS}</svg>`;
}
function logotipo(ancho){
  const alto=(ancho/LOGOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${LOGOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${LOGOTIPO_PATHS}</svg>`;
}

function pintarError(msg){
  const av = document.getElementById('avisoImpresion');
  if(av) av.remove();
  document.getElementById('doc').innerHTML =
    '<div class="error-doc"><h2>Sin datos</h2><p>' + esc(msg) + '</p>'
  + '<p>Vuelve al tablero, entra a la orden de compra y usa su botón <b>PDF para el proveedor</b>.</p></div>';
}

if(!COT){
  pintarError(LEIDO.error || 'No se pudo leer el documento.');
}else{
  const eyebrow = 'Control de Forpass · Compras a proveedores';
  const titulo = 'Orden de Compra';
  document.title = titulo + ' · ' + (COT.folio || '');

  /* ---- Cabecera y pie, iguales en cada hoja: se repiten por página, igual
     que sheetHead()/sheetFoot() en la plantilla de pólizas. ---- */
  function metaHTML(){
    const filas = [
      ['Folio', COT.folio || 'sin folio'],
      ['Fecha de emisión', COT.fecha],
      ['Estatus', COT.estatus || '—'],
      ['Proveedor', COT.proveedor || '—'],
      ['Razón social', COT.proveedorRazonSocial || '—'],
      ['Comedor', COT.comedor],
      ['Fecha de entrega', COT.fechaEntrega],
      ['Tiempo de entrega', COT.tiempoEntrega],
      ['Lugar de entrega', COT.lugarEntrega],
      ['Crédito / condiciones de pago', COT.condicionesPago],
      ['Solicita', COT.solicita || '—']
    ];
    let out = '<table class="metabar"><tr>';
    filas.forEach((par, i)=>{
      out += '<td><div class="k">' + esc(par[0]) + '</div><div class="v">' + esc(par[1]) + '</div></td>';
      if(i % 3 === 2) out += '</tr><tr>';
    });
    out += '</tr></table>';
    return out;
  }

  function cabeceraHTML(){
    return '<div class="cab">'
      +   '<div class="logo-tl">' + isotipo(40) + '</div>'
      +   '<div class="wordmark-tr">' + logotipo(104) + '</div>'
      + '</div>'
      + '<div class="cab-tit"><div class="eyebrow">' + esc(eyebrow) + '</div>'
      +   '<div class="h1">' + esc(titulo) + '</div></div>'
      + metaHTML()
      + (COT.equipoDescripcion
          ? '<div class="franja-equipo"><span class="k">Datos del equipo</span> ' + esc(COT.equipoDescripcion) + '</div>'
          : '');
  }

  function pieHTML(){
    return '<div class="footwrap"><table class="foot"><tr>'
      +   '<td width="34%"><span class="k">Teléfono</span>' + esc(COT.contacto.telOficina)
      +     (COT.contacto.correo ? '<br><br><span class="k">Correo:</span>' + esc(COT.contacto.correo) : '') + '</td>'
      +   '<td width="30%"><span class="k">Oficinas Corporativas:</span>' + COT.contacto.oficinas.map(esc).join('<br>') + '</td>'
      +   '<td class="tag">Sostenemos a los que sostienen todo.</td>'
      + '</tr></table></div>';
  }

  /* ---- Filas de la tabla, ya resueltas en orden de impresión ---- */
  function filaItem(x){
    return '<tr><td>' + esc(x.noPartida) + '</td><td class="cpt">' + esc(x.concepto)
      + (x.numeroParte ? '<div class="parte">N° de parte: ' + esc(x.numeroParte) + '</div>' : '') + '</td>'
      + '<td>' + esc(x.cantidad) + '</td><td>' + esc(x.um || '—') + '</td>'
      + '<td class="n">' + esc(x.precioUnitario) + '</td><td class="n">' + esc(x.importe) + '</td></tr>';
  }
  const filasInfo = COT.renglones.map(x => ({ tipo:'item', html: filaItem(x) }));
  if(!filasInfo.length){
    filasInfo.push({ tipo:'item', html:'<tr><td colspan="6">Sin conceptos capturados.</td></tr>' });
  }

  const cabezaTabla = '<table class="grid"><thead><tr><th>No.</th><th class="cpt">Descripción del artículo</th>'
    + '<th>Cant.</th><th>U.M.</th><th>Precio unit.</th><th>Importe</th></tr></thead><tbody>';

  function totalesHTML(){
    return '<table class="totales">'
      + '<tr><td class="lbl">Subtotal</td><td class="val">' + esc(COT.subtotal) + '</td></tr>'
      + '<tr><td class="lbl">IVA 16%</td><td class="val">' + esc(COT.iva) + '</td></tr>'
      + '<tr class="gran"><td class="lbl">Total</td><td class="val">' + esc(COT.total) + '</td></tr>'
      + '</table>';
  }
  const notasHTML = (COT.notas ? '<div class="notas">' + esc(COT.notas) + '</div>' : '')
    + '<div class="nota-importante"><b>NOTA IMPORTANTE:</b>'
    + '<ul>'
    +   '<li>Anexar esta orden de compra a la factura para poder hacer el cobro de dicha factura.</li>'
    +   '<li>Requisito contener sello y firma en cada factura para hacer efectivo el cobro.</li>'
    +   '<li>Requisito forzoso dejar copia de la orden de compra y la factura en cada punto de entrega.</li>'
    +   '<li>Pedidos que no se entreguen conforme al horario establecido para cada unidad son factor de rechazo (revisar casos especiales).</li>'
    + '</ul></div>';

  /* ---- Una página con un subconjunto de filas (índices sobre filasInfo) ---- */
  function paginaHTML(indices, esUltima){
    let cuerpo = cabezaTabla + indices.map(i=>filasInfo[i].html).join('') + '</tbody></table>';
    if(esUltima) cuerpo += totalesHTML() + notasHTML;
    return '<div class="page"><div class="sheet">' + cabeceraHTML()
      + '<div class="cuerpo">' + cuerpo + '</div>' + pieHTML() + '</div></div>';
  }

  /* ---- Medir, no predecir: se renderiza TODO en una hoja fuera de pantalla
     y se cortan páginas donde el renglón real se sale del área imprimible,
     igual que evitarTraslapeConPie() en la plantilla de pólizas. ---- */
  function paginar(){
    const medidor = document.createElement('div');
    medidor.style.position = 'fixed';
    medidor.style.left = '-9999px';
    medidor.style.top = '0';
    /* Todas las filas en UNA sola hoja de trabajo, sin cortar: es un flujo
       continuo que crece más allá de las 11in, así que su altura NO sirve
       para comparar posiciones absolutas contra el pie de una sola página
       —cada fila después del primer corte quedaría "más allá" del pie por
       definición y saltaría de página sola—. Lo que sí es válido medir aquí
       es la ALTURA de cada fila, y por separado, con la MISMA cabecera, el
       presupuesto de espacio que le queda al cuerpo en una página cualquiera:
       eso es lo que se acumula y se compara. */
    medidor.innerHTML = paginaHTML(filasInfo.map((_,i)=>i), true);
    document.body.appendChild(medidor);

    /* SIEMPRE 'table.grid tbody tr', nunca 'tbody tr' a secas: .totales y
       .foot no llevan <tbody> explícito, así que el navegador les inserta uno
       implícito y un selector pelón agarraba también SUS filas — la misma
       trampa que ya está documentada en la plantilla de pólizas. */
    const filasDom = Array.from(medidor.querySelectorAll('table.grid tbody tr'));
    const alturas = filasDom.map(tr => tr.getBoundingClientRect().height);
    const cuerpoTop = medidor.querySelector('.cuerpo').getBoundingClientRect().top;
    const pieTop = medidor.querySelector('.footwrap').getBoundingClientRect().top;
    /* El presupuesto de una página cualquiera: del top del cuerpo (bajo la
       cabecera) al top del pie, con algo de aire. Es el MISMO en todas las
       páginas porque todas repiten la misma cabecera. */
    const alturaDisponible = pieTop - cuerpoTop - 12;

    document.body.removeChild(medidor);

    const paginas = [];
    let actual = [], usado = 0;
    alturas.forEach((h, i)=>{
      if(usado + h > alturaDisponible && actual.length){
        /* Un encabezado de sección no se queda solo al final de la hoja: se
           arrastra a la siguiente, con su propia altura. */
        let arrastre = [], arrastreAltura = 0;
        if(filasInfo[actual[actual.length-1]].tipo === 'grupo'){
          const idx = actual.pop();
          arrastre = [idx];
          arrastreAltura = alturas[idx];
        }
        paginas.push(actual);
        actual = arrastre;
        usado = arrastreAltura;
      }
      actual.push(i);
      usado += h;
    });
    if(actual.length) paginas.push(actual);

    return paginas;
  }

  /* Repinta las páginas desde cero. Se llama después de que las fuentes
     asienten y otra vez en beforeprint: si Poppins llega tarde, los altos
     medidos con la fuente de respaldo quedan viejos y el reparto se
     desalinea con el pie — la misma trampa ya documentada en la plantilla
     de pólizas ("evitarTraslapeConPie corre después de document.fonts.ready
     y otra vez en beforeprint, que es el único momento que de verdad
     importa"). Volver a pintar es barato: son unas cuantas hojas, no miles
     de renglones. */
  function pintarPaginas(){
    const paginas = paginar();
    let html = paginas.map((indices, i)=> paginaHTML(indices, i === paginas.length - 1)).join('');

    /* Aserción permanente: lo que se coloca tiene que ser exactamente lo que
       había que colocar. Un documento que se ve roto vale más que uno que se
       ve bien y le faltan renglones — mismo principio que
       verificarRenglonesImpresos() en pólizas. */
    const colocados = paginas.reduce((s,p)=> s + p.length, 0);
    if(colocados !== filasInfo.length){
      html = '<div class="banda-roja">Este documento no cuadra: se iban a imprimir '
        + filasInfo.length + ' renglones y se colocaron ' + colocados
        + '. No se envíe así — avisa para revisar la plantilla.</div>' + html;
    }

    document.getElementById('doc').innerHTML = html;
  }

  pintarPaginas();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(pintarPaginas);
  window.addEventListener('beforeprint', pintarPaginas);
}
</script>
</body>
</html>
